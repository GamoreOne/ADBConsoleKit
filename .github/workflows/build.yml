name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: build-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -1d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app"
          else
            echo "Using runner default Xcode"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers
          ls -l build.sh project.yml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Cache libadb
        uses: actions/cache@v4
        with:
          path: Dependencies/adb-mobile/output
          key: libadb-iphoneos-arm64-${{ hashFiles('build.sh') }}-v3
          restore-keys: |
            libadb-iphoneos-arm64-

      - name: Build adb-mobile and generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/build-sh.log"
          test -s Dependencies/adb-mobile/output/libadb.a
          test -f Dependencies/adb-mobile/output/include/adb_public.h \
            -o -f Dependencies/adb-mobile/output/include/adb_puiblic.h
          test -d ADBConsoleKit.xcodeproj

      - name: Build unsigned iPhoneOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project ADBConsoleKit.xcodeproj \
            -scheme ADBConsoleKit \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ADBConsoleKit.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify app binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="$APP_PATH/ADBConsoleKit"
          test -f "$BIN"
          file "$BIN"
          lipo -info "$BIN"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist" || true

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          xattr -cr "$APP_PATH" || true
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/ADBConsoleKit.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/ADBConsoleKit-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/ADBConsoleKit-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/ADBConsoleKit-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/ADBConsoleKit-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ADBConsoleKit-unsigned
          path: ADBConsoleKit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Сборка упала"
            echo
            echo "Хвост build.sh:"
            echo '```'
            tail -n 120 "$RUNNER_TEMP/build-sh.log" 2>/dev/null || echo "(нет build-sh.log)"
            echo '```'
            echo
            echo "Ошибки xcodebuild:"
            echo '```'
            grep -E "error:|fatal error:|undefined symbol|ld:|FAILED" "$RUNNER_TEMP/xcodebuild.log" 2>/dev/null | tail -n 60 \
              || echo "(нет xcodebuild.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/build-sh.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
